name: Deploy Pennie to Azure

# Deployment triggers:
# - Push to main -> Deploy to test environment
# - Tag v*.*.* -> Deploy to production
# - Manual workflow_dispatch -> Choose environment

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  # Determine which environment to deploy to based on trigger
  set-environment:
    name: Set Environment
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'test') || (startsWith(github.ref, 'refs/tags/v') && 'prod') || 'test' }}
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      is_production: ${{ steps.set-env.outputs.is_production }}
      deployment_enabled: ${{ steps.set-env.outputs.deployment_enabled }}
      resource_group: ${{ steps.set-env.outputs.resource_group }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          # Manual dispatch uses input
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
            echo "environment=$ENV" >> $GITHUB_OUTPUT
            if [[ "$ENV" == "prod" ]]; then
              echo "is_production=true" >> $GITHUB_OUTPUT
              echo "resource_group=TMinus15Agents" >> $GITHUB_OUTPUT
            else
              echo "is_production=false" >> $GITHUB_OUTPUT
              echo "resource_group=TMinus15Agents-${ENV^}" >> $GITHUB_OUTPUT
            fi
          # Tags starting with v deploy to production
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "is_production=true" >> $GITHUB_OUTPUT
            echo "resource_group=TMinus15Agents" >> $GITHUB_OUTPUT
          # Push to main deploys to test (when test VM exists)
          else
            echo "environment=test" >> $GITHUB_OUTPUT
            echo "is_production=false" >> $GITHUB_OUTPUT
            echo "resource_group=TMinus15Agents-Test" >> $GITHUB_OUTPUT
          fi

          # Output deployment enabled flag (from environment variable)
          echo "deployment_enabled=${{ vars.AZURE_DEPLOYMENT_ENABLED }}" >> $GITHUB_OUTPUT

          echo "Trigger: ${{ github.event_name }}, Ref: ${{ github.ref }}"
          cat $GITHUB_OUTPUT

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [set-environment]
    environment: ${{ needs.set-environment.outputs.environment }}
    # Only deploy infrastructure when explicitly enabled per environment
    if: ${{ needs.set-environment.outputs.deployment_enabled == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve RDP source IP from dynamic DNS
        id: resolve-dns
        run: |
          # Resolve dynamic DNS hostname to IP for RDP access restriction
          # Uses ADMIN_DDNS_HOSTNAME secret (e.g., bank.knowall.ai)
          DDNS_HOSTNAME="${{ secrets.ADMIN_DDNS_HOSTNAME }}"
          if [ -n "$DDNS_HOSTNAME" ]; then
            echo "Resolving $DDNS_HOSTNAME..."
            RESOLVED_IP=$(dig +short "$DDNS_HOSTNAME" | head -1)
            if [ -n "$RESOLVED_IP" ]; then
              echo "Resolved to: $RESOLVED_IP"
              echo "rdp_source_ip=$RESOLVED_IP" >> $GITHUB_OUTPUT
            else
              echo "::warning::Could not resolve $DDNS_HOSTNAME - RDP will be disabled"
              echo "rdp_source_ip=" >> $GITHUB_OUTPUT
            fi
          else
            echo "No ADMIN_DDNS_HOSTNAME configured - RDP will be disabled"
            echo "rdp_source_ip=" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Bicep templates
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ needs.set-environment.outputs.resource_group }}
          template: ./infra/main.bicep
          parameters: >
            @./infra/main.parameters.${{ needs.set-environment.outputs.environment }}.json
            environmentName=${{ needs.set-environment.outputs.environment }}
            vmAdminPassword=${{ secrets.VM_ADMIN_PASSWORD }}
            allowedRdpSourceIP=${{ steps.resolve-dns.outputs.rdp_source_ip }}
          failOnStdErr: false

      - name: Get deployment outputs
        id: infra-outputs
        run: |
          echo "Getting deployment outputs..."
          # Extract outputs from deployment (VM IP, Key Vault name, etc.)

      - name: Ensure Azure Bot registration exists
        run: |
          # Azure Bot Service registration is required for Teams messaging
          # This creates the bot registration if it doesn't exist
          ENV="${{ needs.set-environment.outputs.environment }}"
          RG="${{ needs.set-environment.outputs.resource_group }}"
          APP_ID="${{ secrets.TEAMS_APP_ID }}"

          if [ "$ENV" = "prod" ]; then
            BOT_NAME="pennie-bot"
            BOT_DISPLAY="Pennie the Prepper"
          else
            BOT_NAME="pennie-bot-${ENV}"
            BOT_DISPLAY="Pennie the Prepper (${ENV})"
          fi

          # Get VM FQDN for messaging endpoint
          VM_FQDN=$(az network public-ip show \
            --resource-group "$RG" \
            --name "pennie-pip-${ENV}" \
            --query "dnsSettings.fqdn" -o tsv 2>/dev/null || echo "")

          if [ -z "$VM_FQDN" ]; then
            echo "::warning::Could not get VM FQDN - bot registration may need manual endpoint update"
            VM_FQDN="pennie-${ENV}.uksouth.cloudapp.azure.com"
          fi

          ENDPOINT="https://${VM_FQDN}/api/messages"
          echo "Bot endpoint: $ENDPOINT"

          # Check if bot registration exists
          EXISTING=$(az resource list \
            --resource-type "Microsoft.BotService/botServices" \
            --query "[?name=='$BOT_NAME'].name" -o tsv 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Bot registration '$BOT_NAME' already exists"
            # Update endpoint if it changed
            az bot update \
              --resource-group "$RG" \
              --name "$BOT_NAME" \
              --endpoint "$ENDPOINT" \
              2>/dev/null || echo "::warning::Could not update bot endpoint"
          else
            echo "Creating bot registration '$BOT_NAME'..."
            # Azure Bot registration with MultiTenant app type
            az bot create \
              --resource-group "$RG" \
              --name "$BOT_NAME" \
              --app-type MultiTenant \
              --appid "$APP_ID" \
              --endpoint "$ENDPOINT" \
              --display-name "$BOT_DISPLAY" \
              --description "Pennie the Prepper - AI Business Analyst for Teams"

            # Enable Teams channel
            echo "Enabling Teams channel..."
            az bot msteams create \
              --resource-group "$RG" \
              --name "$BOT_NAME" \
              2>/dev/null || echo "::warning::Teams channel may already exist"

            echo "✅ Bot registration '$BOT_NAME' created with Teams channel"
          fi

  build-bot:
    name: Build Teams Bot
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ./bot/PennieBot.csproj

      - name: Build
        run: dotnet build ./bot/PennieBot.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./bot/PennieBot.csproj --configuration Release --runtime win-x64 --self-contained true --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pennie-bot
          path: ./publish

  deploy-bot:
    name: Deploy Bot to VM
    runs-on: windows-latest
    needs: [set-environment, build-bot]
    environment: ${{ needs.set-environment.outputs.environment }}
    # Deploy to existing VM (infrastructure deployment optional)
    if: ${{ needs.set-environment.outputs.deployment_enabled == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pennie-bot
          path: ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create deployment package
        run: |
          # Include deployment and configuration scripts in the package
          Copy-Item ./scripts/deploy-bot-to-vm.ps1 ./publish/
          Copy-Item ./scripts/configure-bot-settings.ps1 ./publish/
          Compress-Archive -Path ./publish/* -DestinationPath ./pennie-bot.zip
          Write-Host "Created deployment package: pennie-bot.zip (includes deploy and config scripts)"

      - name: Upload to Azure Storage
        run: |
          # Use explicit storage account from secrets to avoid ambiguity with multiple storage accounts
          $storageAccount = "${{ secrets.AZURE_STORAGE_ACCOUNT }}"
          if ([string]::IsNullOrEmpty($storageAccount)) {
            Write-Host "::error::AZURE_STORAGE_ACCOUNT secret not configured"
            exit 1
          }

          az storage container create `
            --name deployments `
            --account-name $storageAccount `
            --auth-mode login

          $blobName = "pennie-bot-$(Get-Date -Format 'yyyyMMddHHmmss').zip"

          az storage blob upload `
            --account-name $storageAccount `
            --container-name deployments `
            --name $blobName `
            --file ./pennie-bot.zip `
            --auth-mode login `
            --overwrite

          $expiry = (Get-Date).AddHours(1).ToString("yyyy-MM-ddTHH:mmZ")
          $packageUrl = az storage blob generate-sas `
            --account-name $storageAccount `
            --container-name deployments `
            --name $blobName `
            --permissions r `
            --expiry $expiry `
            --auth-mode login `
            --as-user `
            --full-uri -o tsv

          Write-Host "Package URL: $packageUrl"
          echo "PACKAGE_URL=$packageUrl" >> $env:GITHUB_ENV

      - name: Deploy to Windows VM
        run: |
          $vmName = "pennie-vm-${{ github.event.inputs.environment || 'test' }}"
          $rgName = "${{ needs.set-environment.outputs.resource_group }}"
          $packageUrl = $env:PACKAGE_URL

          Write-Host "Deploying to VM: $vmName in RG: $rgName"
          Write-Host "Package URL length: $($packageUrl.Length) chars"

          # Encode URL as Base64 to safely pass through (URL contains special chars)
          $urlBytes = [System.Text.Encoding]::UTF8.GetBytes($packageUrl)
          $urlBase64 = [Convert]::ToBase64String($urlBytes)
          Write-Host "URL encoded to Base64 ($($urlBase64.Length) chars)"

          # Step 1: Write Base64 URL to a file on the VM
          Write-Host "Step 1: Writing Base64 URL to VM file..."
          az vm run-command invoke `
            --resource-group $rgName `
            --name $vmName `
            --command-id RunPowerShellScript `
            --scripts "New-Item -ItemType Directory -Path 'C:\Temp' -Force | Out-Null; Set-Content -Path 'C:\Temp\package-url.txt' -Value '$urlBase64' -Force; Write-Host 'URL file created'"

          # Step 2: Decode URL and download package
          Write-Host "Step 2: Downloading package on VM..."
          az vm run-command invoke `
            --resource-group $rgName `
            --name $vmName `
            --command-id RunPowerShellScript `
            --scripts "`$b64 = (Get-Content 'C:\Temp\package-url.txt' -Raw).Trim(); `$url = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(`$b64)); [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12; Invoke-WebRequest -Uri `$url -OutFile 'C:\Temp\pennie-bot.zip' -UseBasicParsing; Write-Host ('Downloaded: ' + (Get-Item 'C:\Temp\pennie-bot.zip').Length + ' bytes')"

          # Step 3: Backup appsettings.json if exists
          Write-Host "Step 3: Backing up appsettings.json..."
          az vm run-command invoke `
            --resource-group $rgName `
            --name $vmName `
            --command-id RunPowerShellScript `
            --scripts "if (Test-Path 'C:\Pennie\bot\appsettings.json') { Copy-Item 'C:\Pennie\bot\appsettings.json' 'C:\Temp\appsettings.backup' -Force; Write-Host 'Backup created' } else { Write-Host 'No existing appsettings.json' }"

          # Step 4: Extract package
          Write-Host "Step 4: Extracting package..."
          az vm run-command invoke `
            --resource-group $rgName `
            --name $vmName `
            --command-id RunPowerShellScript `
            --scripts "New-Item -ItemType Directory -Path 'C:\Pennie\bot' -Force | Out-Null; Expand-Archive -Path 'C:\Temp\pennie-bot.zip' -DestinationPath 'C:\Pennie\bot' -Force; Write-Host 'Extracted files:'; Get-ChildItem 'C:\Pennie\bot' | ForEach-Object { Write-Host `$_.Name }"

          # Step 5: Restore appsettings.json from backup
          Write-Host "Step 5: Restoring appsettings.json..."
          az vm run-command invoke `
            --resource-group $rgName `
            --name $vmName `
            --command-id RunPowerShellScript `
            --scripts "if (Test-Path 'C:\Temp\appsettings.backup') { Copy-Item 'C:\Temp\appsettings.backup' 'C:\Pennie\bot\appsettings.json' -Force; Remove-Item 'C:\Temp\appsettings.backup' -Force; Write-Host 'Restored appsettings.json' } else { Write-Host 'No backup to restore' }"

          # Step 6: Run the service deployment script (stop service, copy files, start service)
          Write-Host "Step 6: Running service deployment..."
          az vm run-command invoke `
            --resource-group $rgName `
            --name $vmName `
            --command-id RunPowerShellScript `
            --scripts "& 'C:\Pennie\bot\deploy-bot-to-vm.ps1'"

          # Step 7: Setup SSL certificate and Kestrel HTTPS configuration
          Write-Host "Step 7: Setting up SSL certificate and Kestrel config..."

          # Get VM FQDN first (needed for certificate SAN)
          $vmFqdn = az network public-ip show --resource-group $rgName --name "pennie-pip-${{ github.event.inputs.environment || 'test' }}" --query "dnsSettings.fqdn" -o tsv
          if (-not $vmFqdn) {
            Write-Host "Warning: Could not get VM FQDN, using placeholder"
            $vmFqdn = "pennie-vm-${{ github.event.inputs.environment || 'test' }}.uksouth.cloudapp.azure.com"
          }
          Write-Host "VM FQDN: $vmFqdn"

          # Create self-signed SSL certificate and configure Kestrel to use it
          # The bot uses Kestrel (not HTTP.sys), so we add certificate config to appsettings.json
          az vm run-command invoke `
            --resource-group $rgName `
            --name $vmName `
            --command-id RunPowerShellScript `
            --scripts "param([string]`$fqdn) `
              `$certExists = Get-ChildItem Cert:\LocalMachine\My | Where-Object { `$_.Subject -like '*' + `$fqdn + '*' }; `
              if (-not `$certExists) { `
                Write-Host 'Creating self-signed SSL certificate...'; `
                `$cert = New-SelfSignedCertificate -DnsName `$fqdn -CertStoreLocation Cert:\LocalMachine\My -NotAfter (Get-Date).AddYears(2); `
                `$thumbprint = `$cert.Thumbprint; `
                Write-Host ('Created certificate with thumbprint: ' + `$thumbprint); `
              } else { `
                `$thumbprint = `$certExists.Thumbprint; `
                Write-Host ('Using existing certificate: ' + `$thumbprint); `
              }; `
              Write-Host 'Configuring Kestrel HTTPS in appsettings.json...'; `
              `$configPath = 'C:\Pennie\bot\appsettings.json'; `
              `$config = Get-Content `$configPath -Raw | ConvertFrom-Json; `
              `$kestrel = @{ Endpoints = @{ Https = @{ Url = 'https://0.0.0.0:443'; Certificate = @{ Subject = `$fqdn; Store = 'My'; Location = 'LocalMachine'; AllowInvalid = `$true } }; Http = @{ Url = 'http://0.0.0.0:5000' } } }; `
              `$config | Add-Member -NotePropertyName 'Kestrel' -NotePropertyValue `$kestrel -Force; `
              `$config | ConvertTo-Json -Depth 10 | Set-Content `$configPath -Encoding UTF8; `
              [Environment]::SetEnvironmentVariable('ASPNETCORE_URLS', `$null, 'Machine'); `
              Write-Host 'Kestrel HTTPS configuration complete'" `
            --parameters "fqdn=$vmFqdn"

          # Step 8: Configure bot credentials and URLs from GitHub Secrets
          Write-Host "Step 8: Configuring bot credentials..."
          # (vmFqdn already set in step 7)

          # Use environment-specific backend URL (test uses test backend, prod uses prod)
          $env = "${{ github.event.inputs.environment || 'test' }}"
          $backendUrl = "https://pennie-backend-$env.azurewebsites.net"
          Write-Host "Backend URL: $backendUrl"

          # Encode credentials as Base64 to avoid escaping issues in remote script
          $teamsAppId = "${{ secrets.TEAMS_APP_ID }}"
          $teamsAppPassword = "${{ secrets.TEAMS_APP_PASSWORD }}"
          $teamsAppIdB64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($teamsAppId))
          $teamsAppPasswordB64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($teamsAppPassword))

          # Run the configure script on the VM (includes null safety checks)
          az vm run-command invoke `
            --resource-group $rgName `
            --name $vmName `
            --command-id RunPowerShellScript `
            --scripts "param([string]`$AppIdB64, [string]`$PasswordB64, [string]`$Fqdn, [string]`$Backend) `
              `$appId = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(`$AppIdB64)); `
              `$password = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(`$PasswordB64)); `
              & 'C:\Pennie\bot\configure-bot-settings.ps1' `
                -ConfigPath 'C:\Pennie\bot\appsettings.json' `
                -TeamsAppId `$appId `
                -TeamsAppPassword `$password `
                -VmFqdn `$Fqdn `
                -BackendUrl `$Backend" `
            --parameters "AppIdB64=$teamsAppIdB64" "PasswordB64=$teamsAppPasswordB64" "Fqdn=$vmFqdn" "Backend=$backendUrl"

          # Step 9: Restart service to apply new configuration
          Write-Host "Step 9: Restarting service..."
          az vm run-command invoke `
            --resource-group $rgName `
            --name $vmName `
            --command-id RunPowerShellScript `
            --scripts "Restart-Service PennieBot; Start-Sleep -Seconds 5; Get-Service PennieBot | Format-Table Name, Status"

          Write-Host "✅ Bot deployed successfully to $vmName"

  run-smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: [set-environment, deploy-bot]
    environment: ${{ needs.set-environment.outputs.environment }}
    if: ${{ needs.set-environment.outputs.deployment_enabled == 'true' && (needs.deploy-bot.result == 'success' || needs.deploy-bot.result == 'skipped') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run endpoint connectivity tests
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          echo "Running smoke tests for $ENV environment..."

          # Make test script executable and run it
          chmod +x ./tests/bot-endpoint-test.sh
          ./tests/bot-endpoint-test.sh "$ENV"

      - name: Verify bot responds to health check
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          RG="${{ needs.set-environment.outputs.resource_group }}"

          # Get bot FQDN
          VM_FQDN=$(az network public-ip show \
            --resource-group "$RG" \
            --name "pennie-pip-${ENV}" \
            --query "dnsSettings.fqdn" -o tsv 2>/dev/null || echo "")

          if [ -z "$VM_FQDN" ]; then
            echo "::warning::Could not get VM FQDN"
            exit 0
          fi

          # Wait for bot to be ready (up to 60 seconds)
          echo "Waiting for bot health endpoint..."
          for i in {1..12}; do
            HEALTH=$(curl -s -k "https://${VM_FQDN}/health" 2>/dev/null || echo "")
            if [ "$HEALTH" = "Healthy" ]; then
              echo "✅ Bot health check passed"
              exit 0
            fi
            echo "Attempt $i/12: Bot not ready yet..."
            sleep 5
          done

          echo "::error::Bot health check failed after 60 seconds"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment smoke tests failed!"
          echo ""
          echo "Troubleshooting steps:"
          echo "  1. Check bot logs: ./scripts/bot-logs.sh ${{ needs.set-environment.outputs.environment }}"
          echo "  2. Restart service: ./scripts/bot-restart.sh ${{ needs.set-environment.outputs.environment }}"
          echo "  3. Run endpoint tests: ./tests/bot-endpoint-test.sh ${{ needs.set-environment.outputs.environment }}"
          # Note: Rollback would require storing previous deployment artifact

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [set-environment, run-smoke-tests]
    if: ${{ needs.set-environment.outputs.deployment_enabled == 'true' && always() }}

    steps:
      - name: Send notification
        run: |
          # TODO: Send notification to Slack/Teams
          # Use webhook URL from secrets
          echo "Deployment notification sent"
