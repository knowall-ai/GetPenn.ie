name: Deploy Pennie to Azure

# Deployment triggers:
# - Push to main -> Deploy to test environment
# - Tag v*.*.* -> Deploy to production
# - Manual workflow_dispatch -> Choose environment

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  # Determine which environment to deploy to based on trigger
  set-environment:
    name: Set Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      is_production: ${{ steps.set-env.outputs.is_production }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          # Manual dispatch uses input
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
              echo "is_production=true" >> $GITHUB_OUTPUT
            else
              echo "is_production=false" >> $GITHUB_OUTPUT
            fi
          # Tags starting with v deploy to production
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "is_production=true" >> $GITHUB_OUTPUT
          # Push to main deploys to test (when test VM exists)
          else
            echo "environment=test" >> $GITHUB_OUTPUT
            echo "is_production=false" >> $GITHUB_OUTPUT
          fi

          echo "Trigger: ${{ github.event_name }}, Ref: ${{ github.ref }}"
          cat $GITHUB_OUTPUT

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    # Skip infrastructure deployment - VM already exists
    if: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep templates
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          scope: subscription
          region: uksouth
          template: ./infra/main.bicep
          parameters: >
            @./infra/main.parameters.${{ github.event.inputs.environment || 'prod' }}.json
            environmentName=${{ github.event.inputs.environment || 'prod' }}
            teamsAppId=${{ secrets.TEAMS_APP_ID }}
          failOnStdErr: false

      - name: Get deployment outputs
        id: infra-outputs
        run: |
          echo "Getting deployment outputs..."
          # Extract outputs from deployment (VM IP, Key Vault name, etc.)

  build-bot:
    name: Build Teams Bot
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ./bot/PennieBot.csproj

      - name: Build
        run: dotnet build ./bot/PennieBot.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./bot/PennieBot.csproj --configuration Release --runtime win-x64 --self-contained true --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pennie-bot
          path: ./publish

  deploy-bot:
    name: Deploy Bot to VM
    runs-on: windows-latest
    needs: [build-bot]
    environment: ${{ github.event.inputs.environment || 'prod' }}
    # Deploy to existing VM (infrastructure deployment optional)
    if: ${{ vars.AZURE_DEPLOYMENT_ENABLED == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pennie-bot
          path: ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create deployment package
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./pennie-bot.zip
          Write-Host "Created deployment package: pennie-bot.zip"

      - name: Upload to Azure Storage
        run: |
          # Use explicit storage account from secrets to avoid ambiguity with multiple storage accounts
          $storageAccount = "${{ secrets.AZURE_STORAGE_ACCOUNT }}"
          if ([string]::IsNullOrEmpty($storageAccount)) {
            Write-Host "::error::AZURE_STORAGE_ACCOUNT secret not configured"
            exit 1
          }

          az storage container create `
            --name deployments `
            --account-name $storageAccount `
            --auth-mode login

          $blobName = "pennie-bot-$(Get-Date -Format 'yyyyMMddHHmmss').zip"

          az storage blob upload `
            --account-name $storageAccount `
            --container-name deployments `
            --name $blobName `
            --file ./pennie-bot.zip `
            --auth-mode login `
            --overwrite

          $expiry = (Get-Date).AddHours(1).ToString("yyyy-MM-ddTHH:mmZ")
          $packageUrl = az storage blob generate-sas `
            --account-name $storageAccount `
            --container-name deployments `
            --name $blobName `
            --permissions r `
            --expiry $expiry `
            --auth-mode login `
            --as-user `
            --full-uri -o tsv

          Write-Host "Package URL: $packageUrl"
          echo "PACKAGE_URL=$packageUrl" >> $env:GITHUB_ENV

      - name: Deploy to Windows VM
        run: |
          $vmName = "pennie-vm-${{ github.event.inputs.environment || 'prod' }}"
          $rgName = "${{ secrets.AZURE_RESOURCE_GROUP }}"

          # Download and extract package on VM, preserving appsettings.json
          $uploadScript = @'
          param([string]$PackageUrl)

          $TempDir = "C:\Temp"
          $PackagePath = "$TempDir\pennie-bot.zip"
          $ExtractPath = "C:\Pennie\bot"
          $AppSettingsPath = "$ExtractPath\appsettings.json"
          $AppSettingsBackup = "$TempDir\appsettings.json.backup"

          New-Item -ItemType Directory -Path $TempDir -Force | Out-Null
          New-Item -ItemType Directory -Path $ExtractPath -Force | Out-Null

          # CRITICAL: Backup appsettings.json before deployment
          # This file contains VM-specific configuration (AppId, TenantId, KeyVault name)
          if (Test-Path $AppSettingsPath) {
              Write-Host "Backing up existing appsettings.json..."
              Copy-Item -Path $AppSettingsPath -Destination $AppSettingsBackup -Force
          }

          Write-Host "Downloading deployment package..."
          Invoke-WebRequest -Uri $PackageUrl -OutFile $PackagePath

          Write-Host "Extracting to $ExtractPath..."
          Expand-Archive -Path $PackagePath -DestinationPath $ExtractPath -Force

          # CRITICAL: Restore appsettings.json after deployment
          # The deployed package contains template values, not production configuration
          if (Test-Path $AppSettingsBackup) {
              Write-Host "Restoring appsettings.json from backup..."
              Copy-Item -Path $AppSettingsBackup -Destination $AppSettingsPath -Force
              Remove-Item -Path $AppSettingsBackup -Force
              Write-Host "appsettings.json restored successfully"
          } else {
              Write-Host "WARNING: No appsettings.json backup found - manual configuration required"
          }

          Write-Host "Upload complete"
          '@

          az vm run-command invoke `
            --resource-group $rgName `
            --name $vmName `
            --command-id RunPowerShellScript `
            --scripts $uploadScript `
            --parameters "PackageUrl=$env:PACKAGE_URL"

          # Run deployment script
          $deployScript = Get-Content ./scripts/deploy-bot-to-vm.ps1 -Raw

          az vm run-command invoke `
            --resource-group $rgName `
            --name $vmName `
            --command-id RunPowerShellScript `
            --scripts $deployScript

          Write-Host "✅ Bot deployed successfully to $vmName"

  run-smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-bot]
    environment: ${{ github.event.inputs.environment || 'prod' }}
    if: ${{ vars.AZURE_DEPLOYMENT_ENABLED == 'true' && (needs.deploy-bot.result == 'success' || needs.deploy-bot.result == 'skipped') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytest requests

      - name: Run smoke tests
        run: |
          # TODO: Implement smoke tests
          # pytest tests/smoke/ --env=${{ github.event.inputs.environment || 'prod' }}
          echo "Smoke tests would run here"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment smoke tests failed! Rolling back..."
          # TODO: Implement rollback logic

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [run-smoke-tests]
    if: ${{ vars.AZURE_DEPLOYMENT_ENABLED == 'true' && always() }}

    steps:
      - name: Send notification
        run: |
          # TODO: Send notification to Slack/Teams
          # Use webhook URL from secrets
          echo "Deployment notification sent"
